      <stop stop-color="#F6CD52"/>
      <stop offset="1" stop-color="#D99A15"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="40" fill="#16292F"/>
  <rect x="32" y="24" width="448" height="448" rx="40" fill="url(#frame)"/>
