  <title id="title">Witness VR - puzzle panel icon</title>
  <desc id="desc">A golden puzzle panel in a charcoal frame. The supplied Witness puzzle redrawn as a vector maze, with its completed path from the lower-left circle to the upper-right exit.</desc>
