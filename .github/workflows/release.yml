name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Windows build and tests
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: windows-2025
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
              if ($env:REF_NAME -cnotmatch '^v(?<base>[0-9]+\.[0-9]+(?:\.[0-9]+)?)(?<suffix>-[a-zA-Z0-9][a-zA-Z0-9.-]*)?$') {
                  throw 'Release tags must look like v0.1, v1.2.3 or v1.2.3-preview.1.'
              }
              $baseVersion = $Matches['base']
              $suffix = $Matches['suffix']
              if ($baseVersion.Split('.').Count -eq 2) { $baseVersion += '.0' }
              $version = $baseVersion + $suffix
          } else {
              $version = "0.0.0-ci.$env:BUILD_NUMBER.$env:BUILD_ATTEMPT"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache compiler download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/downloads/w64devkit-x64-2.10.0.7z.exe
          key: w64devkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-toolchain.ps1') }}

      - name: Set up verified compiler
        run: ./scripts/setup-toolchain.ps1

      - name: Build, test and package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release.ps1 -Version $env:RELEASE_VERSION

      - name: Upload portable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WitnessVR-${{ steps.version.outputs.version }}
          path: |
            out/releases/*.zip
            out/releases/*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/release-records/
            out/release-*/source-hashes.txt
            out/release-*/test-logs/
            out/release-*/Testing/Temporary/LastTest.log
            out/release-*/Testing/Temporary/LastTestsFailed.log
            out/release-*/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: WitnessVR-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          archive="WitnessVR-${RELEASE_VERSION}.zip"
          sha256sum --check --strict "${archive}.sha256"
          options=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "$archive" "${archive}.sha256" \
            --verify-tag --title "Witness VR ${RELEASE_TAG}" \
            --generate-notes "${options[@]}"
